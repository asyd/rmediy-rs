desc.ch.source: "Signal sent to the analog outputs. In Auto, a detected SPDIF signal has priority over USB. The available choices depend on the model."
desc.ch.ref_level: "Output level for 0 dBFS. Line (DAC): -5/+1/+7/+13 dBu. Phones: Lo-Power or Hi-Power (+15 dB)."
desc.ch.auto_ref_level: "Keeps a continuous dB volume scale when the Ref Level changes. Recommended with Loudness."
desc.ch.mono: "OFF, ON, or \"to Left\": the L+R sum is sent to the left output only."
desc.ch.width: "Stereo width: 1.00 = full stereo, 0 = mono, -1.00 = swapped channels."
desc.ch.m_s_proc: "Mid/Side processing: mono content goes to the left, stereo content to the right."
desc.ch.polarity: "Inverts the signal polarity: Both, Left or Right."
desc.ch.crossfeed: "Bauer crossfeed for headphones: from 1 (subtle, -13 dB) to 5 (strong, -3 dB). 0 = off."
desc.ch.da_filter: "DAC oversampling filter. SD Sharp (default): most linear response, lowest latency. NOS: the gentlest, best impulse response, disables De-Emphasis."
desc.ch.de_emphasis: "DAC de-emphasis filter: Auto (default), ON or OFF. Has no effect with the NOS filter."
desc.ch.dual_eq: "Allows the 5-band EQ to be set separately for the left and right channels."
desc.ch.volume: "Output volume, in steps of 0.5 dB (-96 to +6 dB on the device)."
desc.ch.lock_volume: "Locks the big volume knob. The volume can still be changed in the menus."
desc.ch.balance: "Left/right balance: -1.00 = fully left, +1.00 = fully right."
desc.ch.mute: "Mutes the output. Raising the volume disables mute immediately."
desc.ch.dim: "Lowers the volume by 20 dB. Raising the volume disables Dim immediately."
desc.ch.loopback_to_usb: "Sends the output signal back to USB for recording, before (pre FX) or after (post FX) processing."
desc.ch.dig_dc_protection: "Protection against DC components in the digital signal (OFF, ON, Filter). Not detailed in the manual."
desc.ch.rear_trs_source: "Source of the rear TRS output: Line 1/2 or Phones 3/4 (ADI-2/4 only)."
desc.ch.loudness_enable: "Enables Loudness: adds bass and treble when the volume is low."
desc.ch.bass_gain: "Loudness: maximum bass gain, reached below Low Vol Ref (1 to 10 dB, default 7 dB)."
desc.ch.treble_gain: "Loudness: maximum treble gain, reached below Low Vol Ref (1 to 10 dB, default 7 dB)."
desc.ch.low_vol_ref: "Loudness: volume below which the gain is at its maximum. It drops to zero 20 dB above. Unit to be confirmed on the device."
desc.tone.b_t_enable: "Enables the Bass/Treble controls of this output."
desc.tone.bass_gain: "Bass boost or cut, in steps of 0.5 dB (±6 dB on the DAC)."
desc.tone.bass_freq: "Bass filter frequency, from 20 to 150 Hz (default 85 Hz)."
desc.tone.bass_q: "Bass filter quality factor, from 0.5 to 1.5 (default 0.9)."
desc.tone.treble_gain: "Treble boost or cut, in steps of 0.5 dB (±6 dB on the DAC)."
desc.tone.treble_freq: "Treble filter frequency, from 3 to 10 kHz (default 6.5 kHz)."
desc.tone.treble_q: "Treble filter quality factor, from 0.5 to 1.5 (default 0.7)."
desc.tone.eq_enable: "Enables the 5-band parametric EQ of this output (the curve is greyed out when it is disabled)."
desc.tone.load_b_t_w_preset: "Also loads the Bass/Treble settings when an EQ preset is loaded."
desc.eq.band_type: "Filter type. Band 1: Peak, Shelf, Hi Pass or Hi Cut. Band 5: Peak, Shelf or Hi Cut. Bands 2 to 4 are fixed to Peak."
desc.eq.band_gain: "Band gain, from -12 to +12 dB in steps of 0.5 dB. Has no effect on Hi Pass and Hi Cut filters."
desc.eq.band_freq: "Center (or cutoff) frequency of the band. Bands 1 to 3: 20 Hz to 20 kHz. Bands 4 and 5: 200 Hz to 20 kHz. Steps are proportional."
desc.eq.band_q: "Quality factor: the higher it is, the narrower the band. Bands 1 to 3: 0.5 to 9.9. Bands 4 and 5: 0.5 to 5.0."
desc.dev.mute_line_vs: "Vs. Phones (default): plugging in headphones mutes the Line output. Toggle: manual front/rear switch with a long press on Volume."
desc.dev.auto_standby: "Automatically puts the device in standby after a period of inactivity."
desc.dev.dsd_detection: "Automatic DSD detection on SPDIF and USB (default: ON)."
desc.dev.dsd_filter: "High-frequency noise filter of the DSD Direct mode: 50 kHz for DSD64, 150 kHz for DSD128 and 256."
desc.dev.dsd_direct_line: "Plays DSD without PCM conversion, on the rear outputs. No more volume or DSP: only the Ref Level changes the level. Phones and IEM are disabled."
desc.dev.clock_source: "Current clock source, selected automatically by the device."
desc.dev.sample_rate: "Current sample rate, read-only."
desc.dev.remap_keys: "OFF, ON or IR-Remote: reassigns the 4 function keys (unit and/or remote control)."
desc.dev.display_mode: "Dark inverts the display: black background, light grey text."
desc.dev.meter_color: "Color of the level meter screen in PCM and DSD."
desc.dev.hor_meter: "Horizontal meter below the analyzer: Post-FX (after processing), Pre-FX (before), or Dual (both)."
desc.dev.autodark_mode: "Turns off the LEDs and the display after 10 s of inactivity (3 s with the remote control)."
desc.dev.show_vol_screen: "Shows the volume screen when the Volume knob is turned."
desc.dev.lock_ui: "Locks the interface: OFF, Remote, Keys, or Keys+Rem."
desc.status.all: "Raw value from the status message. The mapping to labels is not documented by RME."
