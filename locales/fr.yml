desc.ch.source: "Signal envoyé aux sorties analogiques. En Auto, un signal SPDIF détecté a priorité sur l'USB. Les choix dépendent du modèle."
desc.ch.ref_level: "Niveau de sortie pour 0 dBFS. Line (DAC) : -5/+1/+7/+13 dBu. Phones : Lo-Power ou Hi-Power (+15 dB)."
desc.ch.auto_ref_level: "Garde une échelle de volume continue en dB quand le Ref Level change. Recommandé avec le Loudness."
desc.ch.mono: "OFF, ON, ou « to Left » : la somme L+R n'est envoyée qu'à gauche."
desc.ch.width: "Largeur stéréo : 1,00 = stéréo complet, 0 = mono, -1,00 = canaux inversés."
desc.ch.m_s_proc: "Traitement Mid/Side : le contenu mono va à gauche, le stéréo à droite."
desc.ch.polarity: "Inverse la polarité du signal : Both, Left ou Right."
desc.ch.crossfeed: "Crossfeed Bauer pour casque : de 1 (discret, -13 dB) à 5 (fort, -3 dB). 0 = désactivé."
desc.ch.da_filter: "Filtre de suréchantillonnage du DAC. SD Sharp (défaut) : réponse la plus linéaire, latence minimale. NOS : le plus doux, meilleure réponse impulsionnelle, désactive De-Emphasis."
desc.ch.de_emphasis: "Filtre de dé-emphase du DAC : Auto (défaut), ON ou OFF. Sans effet avec le filtre NOS."
desc.ch.dual_eq: "Permet de régler l'EQ 5 bandes séparément pour la gauche et la droite."
desc.ch.volume: "Volume de la sortie, par pas de 0,5 dB (de -96 à +6 dB sur l'appareil)."
desc.ch.lock_volume: "Verrouille le gros bouton de volume. Le volume reste réglable dans les menus."
desc.ch.balance: "Balance gauche/droite : -1,00 = tout à gauche, +1,00 = tout à droite."
desc.ch.mute: "Coupe la sortie. Monter le volume désactive le mute immédiatement."
desc.ch.dim: "Baisse le volume de 20 dB. Monter le volume désactive Dim immédiatement."
desc.ch.loopback_to_usb: "Renvoie le signal de la sortie vers l'USB pour l'enregistrer, avant (pre FX) ou après (post FX) traitement."
desc.ch.dig_dc_protection: "Protection contre les composantes continues du signal numérique (OFF, ON, Filter). Non détaillé dans le manuel."
desc.ch.rear_trs_source: "Source de la sortie TRS arrière : Line 1/2 ou Phones 3/4 (ADI-2/4 uniquement)."
desc.ch.loudness_enable: "Active le Loudness : ajoute des basses et des aiguës quand le volume est bas."
desc.ch.bass_gain: "Loudness : gain maximal des basses, atteint sous Low Vol Ref (1 à 10 dB, défaut 7 dB)."
desc.ch.treble_gain: "Loudness : gain maximal des aiguës, atteint sous Low Vol Ref (1 à 10 dB, défaut 7 dB)."
desc.ch.low_vol_ref: "Loudness : volume sous lequel le gain est maximal. Il est nul 20 dB au-dessus. Unité à confirmer sur l'appareil."
desc.tone.b_t_enable: "Active les réglages Bass/Treble de cette sortie."
desc.tone.bass_gain: "Gain ou atténuation des basses, par pas de 0,5 dB (±6 dB sur le DAC)."
desc.tone.bass_freq: "Fréquence du filtre de basses, de 20 à 150 Hz (défaut 85 Hz)."
desc.tone.bass_q: "Facteur de qualité du filtre de basses, de 0,5 à 1,5 (défaut 0,9)."
desc.tone.treble_gain: "Gain ou atténuation des aiguës, par pas de 0,5 dB (±6 dB sur le DAC)."
desc.tone.treble_freq: "Fréquence du filtre d'aiguës, de 3 à 10 kHz (défaut 6,5 kHz)."
desc.tone.treble_q: "Facteur de qualité du filtre d'aiguës, de 0,5 à 1,5 (défaut 0,7)."
desc.tone.eq_enable: "Active l'EQ paramétrique 5 bandes de cette sortie (courbe grisée quand il est désactivé)."
desc.tone.load_b_t_w_preset: "Charge aussi les réglages Bass/Treble quand on charge un preset EQ."
desc.eq.band_type: "Type de filtre. Bande 1 : Peak, Shelf, Hi Pass ou Hi Cut. Bande 5 : Peak, Shelf ou Hi Cut. Les bandes 2 à 4 sont fixées en Peak."
desc.eq.band_gain: "Gain de la bande, de -12 à +12 dB par pas de 0,5 dB. Sans effet sur les filtres Hi Pass et Hi Cut."
desc.eq.band_freq: "Fréquence centrale (ou de coupure) de la bande. Bandes 1 à 3 : 20 Hz à 20 kHz. Bandes 4 et 5 : 200 Hz à 20 kHz. Les pas sont proportionnels."
desc.eq.band_q: "Facteur de qualité : plus il est élevé, plus la bande est étroite. Bandes 1 à 3 : 0,5 à 9,9. Bandes 4 et 5 : 0,5 à 5,0."
desc.dev.mute_line_vs: "Vs. Phones (défaut) : brancher un casque coupe la sortie Line. Toggle : bascule manuelle avant/arrière par appui long sur Volume."
desc.dev.auto_standby: "Mise en veille automatique de l'appareil après une période d'inactivité."
desc.dev.dsd_detection: "Détection automatique du DSD sur SPDIF et USB (défaut : ON)."
desc.dev.dsd_filter: "Filtre de bruit haute fréquence du mode DSD Direct : 50 kHz pour DSD64, 150 kHz pour DSD128 et 256."
desc.dev.dsd_direct_line: "Lit le DSD sans conversion PCM, sur les sorties arrière. Plus de volume ni de DSP, seul le Ref Level change le niveau. Phones et IEM sont désactivés."
desc.dev.clock_source: "Source d'horloge courante, choisie automatiquement par l'appareil."
desc.dev.sample_rate: "Fréquence d'échantillonnage courante, en lecture seule."
desc.dev.remap_keys: "OFF, ON ou IR-Remote : réassigne les 4 touches de fonction (unité et/ou télécommande)."
desc.dev.display_mode: "Dark inverse l'affichage : fond noir, texte gris clair."
desc.dev.meter_color: "Couleur de l'écran des vumètres en PCM et en DSD."
desc.dev.hor_meter: "Vumètre horizontal sous l'analyseur : Post-FX (après traitement), Pre-FX (avant), ou Dual (les deux)."
desc.dev.autodark_mode: "Éteint LEDs et écran après 10 s d'inactivité (3 s avec la télécommande)."
desc.dev.show_vol_screen: "Affiche l'écran de volume quand on tourne le bouton Volume."
desc.dev.lock_ui: "Verrouille l'interface : OFF, Remote, Keys, ou Keys+Rem."
desc.status.all: "Valeur brute du message de statut. La correspondance avec des libellés n'est pas documentée par RME."
ui.help: "←/→ valeur  ↑/↓ param  Tab onglet  s côté L/R (EQ)  r rafraîchir  q quitter"
